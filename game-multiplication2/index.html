<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法蓋房子大挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'DFKai-SB';
            src: local('DFKai-SB'), local('BiauKai'), local('標楷體');
        }

        * {
            font-family: 'DFKai-SB', '標楷體', 'BiauKai', serif !important;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 溫柔淡淡橘色系馬卡龍漸層背景 */
        body {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 50%, #fef3c7 100%);
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 注音符號直書排版與精確定位 */
        .word-wrap {
            display: inline-flex;
            align-items: center;
            margin: 0 1px;
            vertical-align: middle;
            line-height: 1;
            white-space: nowrap;
        }

        .char {
            font-weight: bold;
            color: inherit;
        }

        .bopomofo {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.42em;
            line-height: 1.05;
            margin-left: 1px;
            padding-right: 5px;
            color: inherit;
            opacity: 0.88;
            font-weight: normal;
        }

        .tone-right {
            position: absolute;
            right: -2px;
            top: 50%;
            transform: translateY(-55%);
            font-size: 0.95em;
            font-weight: bold;
        }

        /* 溫柔質感卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            border: 4px solid rgba(255, 255, 255, 0.98);
            box-shadow: 0 20px 40px rgba(234, 88, 12, 0.08);
        }

        /* 氣泡按鈕與微雕影 */
        .btn-bubbly {
            transition: all 0.12s ease-out;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
        }
        .btn-bubbly:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-correct {
            background-color: #22c55e !important;
            box-shadow: 0 6px 0 #15803d !important;
            color: white !important;
            animation: pulse 0.25s ease-in-out;
        }

        .btn-wrong {
            background-color: #f43f5e !important;
            box-shadow: 0 6px 0 #be123c !important;
            color: white !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* 房子基地容器 */
        .house-container {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            min-height: 280px;
            width: 100%;
            overflow-y: auto;
            border-bottom: 8px solid #84cc16;
            background: linear-gradient(180deg, rgba(255,247,237,0.4) 0%, rgba(254,243,199,0.5) 100%);
            border-radius: 18px;
            padding: 12px 0;
            position: relative;
        }

        /* 房子積木 */
        .house-block {
            width: 150px;
            height: 48px;
            margin-bottom: 3px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18), 0 4px 6px rgba(0,0,0,0.08);
            animation: buildUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
        }

        @keyframes buildUp {
            from { transform: translateY(-30px) scale(0.7); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* 槌子敲碎動畫 */
        .hammer-icon {
            position: absolute;
            font-size: 70px;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transform-origin: bottom right;
            top: 20%;
            left: 50%;
        }

        .hammer-hit {
            animation: hammerSmash 0.5s ease-in-out forwards;
        }

        @keyframes hammerSmash {
            0% { opacity: 0; transform: translate(40px, -60px) rotate(45deg); }
            40% { opacity: 1; transform: translate(-20px, 10px) rotate(-35deg); }
            70% { opacity: 1; transform: translate(-25px, 15px) rotate(-15deg); }
            100% { opacity: 0; transform: translate(-30px, 20px) rotate(0deg); }
        }

        .block-destroy {
            animation: destroyBlock 0.4s ease-in forwards !important;
        }

        @keyframes destroyBlock {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25) rotate(12deg); background-color: #ef4444; }
            100% { transform: scale(0) rotate(-20deg); opacity: 0; }
        }

        /* 選項按鈕選中樣式（暖橘色系） */
        .opt-selected {
            background-color: #f97316 !important;
            color: white !important;
            border-color: #ea580c !important;
        }
    </style>
</head>
<body>

<!-- 1. 設定畫面 -->
<div id="setup-screen" class="w-full max-w-3xl glass-card rounded-3xl p-6 sm:p-10 text-center my-auto">
    <div id="main-title" class="mb-6 flex flex-wrap justify-center items-center gap-1 text-3xl sm:text-5xl font-bold text-orange-900"></div>

    <!-- 模式選擇 -->
    <div class="flex justify-center gap-4 sm:gap-6 mb-6">
        <button id="mode-single-btn" onclick="selectMode('single')" class="btn-bubbly px-6 py-4 rounded-2xl text-xl sm:text-2xl font-bold border-4 border-orange-300 bg-orange-100 text-orange-950">
            <span class="bpmf-text">單[ㄉㄢ]人[ㄖㄣˊ]蓋[ㄍㄞˋ]房[ㄈㄤˊ]子[ㄗ˙]</span>
        </button>
        <button id="mode-pvp-btn" onclick="selectMode('pvp')" class="btn-bubbly px-6 py-4 rounded-2xl text-xl sm:text-2xl font-bold border-4 border-amber-300 bg-amber-50 text-amber-900 opacity-60">
            <span class="bpmf-text">雙[ㄕㄨㄤ]人[ㄖㄣˊ]對[ㄉㄨㄟˋ]建[ㄐㄧㄢˋ]</span>
        </button>
    </div>

    <!-- 設定選項容器（淡橘色底） -->
    <div class="bg-orange-50/80 p-6 rounded-3xl border-2 border-orange-200 mb-8 max-w-xl mx-auto text-left space-y-5">
        <div>
            <label class="block text-xl font-bold text-orange-950 mb-2">
                <span class="bpmf-text">1. 設[ㄕㄜˋ]定[ㄉㄧㄥˋ]時[ㄕˊ]間[ㄐㄧㄢ]：</span>
            </label>
            <div class="grid grid-cols-2 gap-4">
                <button type="button" id="time-120-btn" onclick="selectTimeSetting(120)" class="btn-bubbly py-3 px-4 rounded-2xl border-2 border-orange-300 font-bold text-lg text-orange-900 bg-white opt-selected">
                    <span class="bpmf-text">2 分[ㄈㄣ]鐘[ㄓㄨㄥ] (120秒)</span>
                </button>
                <button type="button" id="time-180-btn" onclick="selectTimeSetting(180)" class="btn-bubbly py-3 px-4 rounded-2xl border-2 border-orange-300 font-bold text-lg text-orange-900 bg-white">
                    <span class="bpmf-text">3 分[ㄈㄣ]鐘[ㄓㄨㄥ] (180秒)</span>
                </button>
            </div>
        </div>

        <div>
            <label class="block text-xl font-bold text-orange-950 mb-2">
                <span class="bpmf-text">2. 設[ㄕㄜˋ]定[ㄉㄧㄥˋ]題[ㄊㄧˊ]型[ㄒㄧㄥˊ]：</span>
            </label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" id="digit-2x1-btn" onclick="selectDigitSetting('2x1')" class="btn-bubbly py-2.5 px-1 rounded-2xl border-2 border-orange-300 font-bold text-xs sm:text-sm text-orange-900 bg-white opt-selected whitespace-nowrap">
                    <span class="bpmf-text">兩[ㄌㄧㄤˇ]位[ㄨㄟˋ] × 一[ㄧ]位[ㄨㄟˋ]</span>
                </button>
                <button type="button" id="digit-3x1-btn" onclick="selectDigitSetting('3x1')" class="btn-bubbly py-2.5 px-1 rounded-2xl border-2 border-orange-300 font-bold text-xs sm:text-sm text-orange-900 bg-white whitespace-nowrap">
                    <span class="bpmf-text">三[ㄙㄢ]位[ㄨㄟˋ] × 一[ㄧ]位[ㄨㄟˋ]</span>
                </button>
                <button type="button" id="digit-mix-btn" onclick="selectDigitSetting('mix')" class="btn-bubbly py-2.5 px-1 rounded-2xl border-2 border-orange-300 font-bold text-xs sm:text-sm text-orange-900 bg-white whitespace-nowrap">
                    <span class="bpmf-text">混[ㄏㄨㄣˋ]合[ㄏㄜˊ]隨[ㄙㄨㄟˊ]機[ㄐㄧ]</span>
                </button>
            </div>
        </div>

        <div id="p1-only-box" class="pt-2 border-t border-orange-200">
            <label class="block text-lg font-bold text-orange-950 mb-1">
                <span class="bpmf-text">玩[ㄨㄢˊ]家[ㄐㄧㄚ]名[ㄇㄧㄥˊ]字[ㄗˋ]：</span>
            </label>
            <input type="text" id="p1-name-single" value="小小建築師" maxlength="8" 
                   class="w-full text-center text-xl p-3 border-2 border-orange-300 rounded-2xl focus:outline-none focus:border-orange-500 bg-white font-bold text-orange-950">
        </div>

        <div id="pvp-box" class="hidden pt-2 border-t border-orange-200 grid grid-cols-2 gap-4">
            <div>
                <label class="block text-base font-bold text-rose-800 mb-1">
                    <span class="bpmf-text">左[ㄗㄨㄛˇ]邊[ㄅㄧㄢ]玩[ㄨㄢˊ]家[ㄐㄧㄚ]：</span>
                </label>
                <input type="text" id="p1-name-pvp" value="建築師 1" maxlength="6" 
                       class="w-full text-center text-lg p-2.5 border-2 border-rose-300 rounded-2xl focus:outline-none focus:border-rose-500 bg-white font-bold text-rose-900">
            </div>
            <div>
                <label class="block text-base font-bold text-teal-800 mb-1">
                    <span class="bpmf-text">右[ㄧㄡˋ]邊[ㄅㄧㄢ]玩[ㄨㄢˊ]家[ㄐㄧㄚ]：</span>
                </label>
                <input type="text" id="p2-name-pvp" value="建築師 2" maxlength="6" 
                       class="w-full text-center text-lg p-2.5 border-2 border-teal-300 rounded-2xl focus:outline-none focus:border-teal-500 bg-white font-bold text-teal-900">
            </div>
        </div>
    </div>

    <button onclick="startGame()" class="btn-bubbly bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-2xl sm:text-3xl px-12 py-4 rounded-full border-b-6 border-emerald-700 shadow-lg">
        <span class="bpmf-text">開[ㄎㄞ]始[ㄕˇ]蓋[ㄍㄞˋ]房[ㄈㄤˊ]子[ㄗ˙]！</span>
    </button>
</div>

<!-- 2. 單人大版面遊戲畫面 -->
<div id="single-game-screen" class="hidden w-full max-w-6xl h-[90vh] glass-card rounded-3xl p-4 sm:p-6 flex flex-col justify-between my-auto relative">
    <div id="single-hammer" class="hammer-icon">🔨</div>

    <!-- 頂部資訊列 -->
    <div class="flex justify-between items-center bg-orange-50/90 px-6 py-3 rounded-2xl border-2 border-orange-200 mb-3 text-xl sm:text-3xl font-bold">
        <div class="text-orange-950 flex items-center gap-2">
            <span id="single-player-tag"></span>
        </div>
        <div class="text-amber-600 flex items-center gap-1">
            <span class="bpmf-text">時[ㄕˊ]間[ㄐㄧㄢ]：</span>
            <span id="single-timer" class="text-3xl sm:text-5xl font-black text-amber-600">120</span>
            <span class="bpmf-text">秒[ㄇㄧㄠˇ]</span>
        </div>
        <div class="text-emerald-600 flex items-center gap-1">
            <span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]：</span>
            <span id="single-height" class="text-3xl sm:text-5xl font-black">0</span>
            <span class="bpmf-text">層[ㄘㄥˊ]</span>
        </div>
    </div>

    <!-- 左右分欄主區域 -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 items-stretch overflow-hidden">
        
        <!-- 左側：蓋房子基地（佔 5 欄） -->
        <div class="lg:col-span-5 bg-white/80 rounded-2xl p-4 border-2 border-emerald-200 flex flex-col justify-between h-full shadow-inner">
            <div class="text-center font-bold text-emerald-800 text-lg mb-2">
                <span class="bpmf-text">🏠 蓋[ㄍㄞˋ]房[ㄈㄤˊ]子[ㄗ˙]基[ㄐㄧ]地[ㄉㄧˋ]</span>
            </div>
            <div id="single-house" class="house-container"></div>
        </div>

        <!-- 右側：題目與按鈕區（佔 7 欄） -->
        <div class="lg:col-span-7 flex flex-col justify-between gap-4 h-full">
            <div class="flex-1 flex flex-col justify-center items-center bg-orange-100/60 rounded-3xl border-4 border-orange-300 p-6 text-center shadow-sm">
                <div class="text-gray-500 font-bold text-lg mb-2"><span class="bpmf-text">請[ㄑㄧㄥˇ]算[ㄙㄨㄢˋ]算[ㄙㄨㄢˋ]看[ㄎㄢˋ]：</span></div>
                <div id="single-question" class="text-6xl sm:text-8xl font-black text-orange-950 tracking-wider">35 × 8 = ?</div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button class="single-opt btn-bubbly bg-orange-400 hover:bg-orange-500 text-white text-4xl sm:text-6xl font-black py-6 sm:py-8 rounded-3xl border-b-8 border-orange-600" onclick="checkSingleAnswer(0)"></button>
                <button class="single-opt btn-bubbly bg-orange-400 hover:bg-orange-500 text-white text-4xl sm:text-6xl font-black py-6 sm:py-8 rounded-3xl border-b-8 border-orange-600" onclick="checkSingleAnswer(1)"></button>
                <button class="single-opt btn-bubbly bg-orange-400 hover:bg-orange-500 text-white text-4xl sm:text-6xl font-black py-6 sm:py-8 rounded-3xl border-b-8 border-orange-600" onclick="checkSingleAnswer(2)"></button>
            </div>
        </div>
    </div>
</div>

<!-- 3. 雙人對戰模式畫面 -->
<div id="pvp-game-screen" class="hidden w-full max-w-7xl h-[92vh] flex flex-col justify-between gap-3 my-auto">
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 relative">
        
        <!-- 左側玩家 1 -->
        <div class="glass-card rounded-3xl p-4 flex flex-col justify-between border-4 border-rose-300 bg-rose-50/40 relative">
            <div id="p1-hammer" class="hammer-icon">🔨</div>
            <div class="flex justify-between items-center bg-white/90 px-4 py-2 rounded-xl text-lg font-bold text-rose-900 border border-rose-200">
                <span id="p1-display-name" class="text-rose-600 font-extrabold text-2xl"></span>
                <div><span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]：</span><span id="p1-height" class="text-3xl text-rose-600 font-black">0</span> <span class="bpmf-text">層[ㄘㄥˊ]</span></div>
            </div>

            <div class="my-2 flex-1 min-h-[160px]">
                <div id="p1-house" class="house-container"></div>
            </div>

            <div class="my-2 text-center py-4 bg-white/80 rounded-2xl border-2 border-rose-200">
                <div id="p1-question" class="text-4xl sm:text-6xl font-black text-rose-950 tracking-wider"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <button class="p1-opt btn-bubbly bg-rose-400 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-rose-600" onclick="checkPvpAnswer(1, 0)"></button>
                <button class="p1-opt btn-bubbly bg-rose-400 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-rose-600" onclick="checkPvpAnswer(1, 1)"></button>
                <button class="p1-opt btn-bubbly bg-rose-400 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-rose-600" onclick="checkPvpAnswer(1, 2)"></button>
            </div>
        </div>

        <!-- 中央倒數 -->
        <div class="hidden md:flex absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex-col items-center">
            <div class="bg-amber-400 text-amber-950 font-black text-xl px-5 py-3 rounded-full border-4 border-white shadow-2xl flex flex-col items-center">
                <span class="text-xs bpmf-text font-normal text-amber-900">倒[ㄉㄠˋ]數[ㄕㄨˋ]</span>
                <span id="pvp-timer-desktop" class="text-3xl text-red-700 font-black">120</span>
            </div>
        </div>

        <!-- 右側玩家 2 -->
        <div class="glass-card rounded-3xl p-4 flex flex-col justify-between border-4 border-teal-300 bg-teal-50/40 relative">
            <div id="p2-hammer" class="hammer-icon">🔨</div>
            <div class="flex justify-between items-center bg-white/90 px-4 py-2 rounded-xl text-lg font-bold text-teal-900 border border-teal-200">
                <span id="p2-display-name" class="text-teal-600 font-extrabold text-2xl"></span>
                <div><span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]：</span><span id="p2-height" class="text-3xl text-teal-600 font-black">0</span> <span class="bpmf-text">層[ㄘㄥˊ]</span></div>
            </div>

            <div class="my-2 flex-1 min-h-[160px]">
                <div id="p2-house" class="house-container"></div>
            </div>

            <div class="my-2 text-center py-4 bg-white/80 rounded-2xl border-2 border-teal-200">
                <div id="p2-question" class="text-4xl sm:text-6xl font-black text-teal-950 tracking-wider"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <button class="p2-opt btn-bubbly bg-teal-500 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-teal-700" onclick="checkPvpAnswer(2, 0)"></button>
                <button class="p2-opt btn-bubbly bg-teal-500 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-teal-700" onclick="checkPvpAnswer(2, 1)"></button>
                <button class="p2-opt btn-bubbly bg-teal-500 text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6 border-teal-700" onclick="checkPvpAnswer(2, 2)"></button>
            </div>
        </div>
    </div>

    <div class="md:hidden bg-amber-400 text-amber-950 rounded-full py-2 px-4 text-center font-bold text-lg border-2 border-white flex justify-center items-center gap-2">
        <span class="bpmf-text">剩[ㄕㄥˋ]餘[ㄩˊ]時[ㄕˊ]間[ㄐㄧㄢ]：</span>
        <span id="pvp-timer-mobile" class="text-2xl text-red-700 font-black">120</span>
        <span class="bpmf-text">秒[ㄇㄧㄠˇ]</span>
    </div>
</div>

<!-- 4. 結算畫面 -->
<div id="result-screen" class="hidden w-full max-w-3xl glass-card rounded-3xl p-6 sm:p-10 text-center my-auto">
    <div id="result-title" class="mb-4 flex justify-center text-3xl sm:text-5xl font-bold text-orange-950"></div>
    <div id="winner-announcement" class="hidden my-4 p-5 rounded-2xl bg-gradient-to-r from-amber-100 via-amber-200 to-amber-100 border-4 border-amber-300 text-amber-900 font-black text-2xl sm:text-4xl shadow-md"></div>
    <div id="result-stats-box" class="bg-white/90 p-6 rounded-3xl border-2 border-orange-200 my-6 text-left space-y-4 max-w-2xl mx-auto text-xl sm:text-2xl"></div>

    <button onclick="resetToHome()" class="btn-bubbly bg-orange-500 hover:bg-orange-600 text-white font-bold text-2xl sm:text-3xl px-12 py-4 rounded-full border-b-6 border-orange-700 mt-2">
        <span class="bpmf-text">回[ㄏㄨㄟˊ]首[ㄕㄡˇ]頁[ㄧㄝˋ] / 再[ㄗㄞˋ]玩[ㄨㄢˊ]一[ㄧ]次[ㄘˋ]</span>
    </button>
</div>

<script>
    const COLORS = ['bg-amber-400', 'bg-orange-400', 'bg-emerald-400', 'bg-sky-400', 'bg-rose-400', 'bg-purple-400'];

    let selectedTime = 120;
    let selectedDigitMode = '2x1';

    // 精確注音符號轉譯
    function parseBpmf(text) {
        if (!text) return '';
        return text.replace(/([^\u0000-\u007F]+)(?:\[([^\]]+)\])/g, (match, char, bpmf) => {
            let tone = '';
            let mainSymbols = bpmf;
            if (['ˊ','ˇ','ˋ','˙'].some(t => bpmf.includes(t))) {
                tone = bpmf.slice(-1);
                mainSymbols = bpmf.slice(0, -1);
            }
            let symHtml = mainSymbols.split('').join('<br>');
            let toneHtml = tone ? `<span class="tone-right">${tone}</span>` : '';
            return `<span class="word-wrap"><span class="char">${char}</span><span class="bopomofo">${symHtml}${toneHtml}</span></span>`;
        });
    }

    function renderAllBpmfText() {
        document.querySelectorAll('.bpmf-text').forEach(el => {
            if (!el.dataset.raw) {
                el.dataset.raw = el.innerText;
            }
            el.innerHTML = parseBpmf(el.dataset.raw);
        });
    }

    let currentMode = 'single';
    let timerId = null;
    let timeLeft = selectedTime;

    let singleState = { name: '小小建築師', height: 0, wrong: 0, ans: 0, hasErrored: false };
    let pvpState = {
        p1: { name: '建築師 1', height: 0, wrong: 0, ans: 0, errored: false },
        p2: { name: '建築師 2', height: 0, wrong: 0, ans: 0, errored: false }
    };

    function selectTimeSetting(timeVal) {
        selectedTime = timeVal;
        document.getElementById('time-120-btn').classList.toggle('opt-selected', timeVal === 120);
        document.getElementById('time-180-btn').classList.toggle('opt-selected', timeVal === 180);
    }

    function selectDigitSetting(modeVal) {
        selectedDigitMode = modeVal;
        ['2x1', '3x1', 'mix'].forEach(m => {
            const btn = document.getElementById(`digit-${m}-btn`);
            btn.classList.toggle('opt-selected', m === modeVal);
        });
    }

    function selectMode(mode) {
        currentMode = mode;
        const btnSingle = document.getElementById('mode-single-btn');
        const btnPvp = document.getElementById('mode-pvp-btn');
        const p1OnlyBox = document.getElementById('p1-only-box');
        const pvpBox = document.getElementById('pvp-box');

        if (mode === 'single') {
            btnSingle.classList.remove('opacity-60');
            btnSingle.classList.add('bg-orange-100', 'border-orange-300');
            btnPvp.classList.add('opacity-60');
            p1OnlyBox.classList.remove('hidden');
            pvpBox.classList.add('hidden');
        } else {
            btnPvp.classList.remove('opacity-60');
            btnPvp.classList.add('bg-amber-100', 'border-amber-300');
            btnSingle.classList.add('opacity-60');
            p1OnlyBox.classList.add('hidden');
            pvpBox.classList.remove('hidden');
        }
    }

    function generateQuestion() {
        let is3Digit = false;
        if (selectedDigitMode === '2x1') is3Digit = false;
        else if (selectedDigitMode === '3x1') is3Digit = true;
        else if (selectedDigitMode === 'mix') is3Digit = Math.random() < 0.5;

        const numFront = is3Digit 
            ? Math.floor(Math.random() * 900) + 100 
            : Math.floor(Math.random() * 90) + 10;   

        const numBack = Math.floor(Math.random() * 8) + 2; 
        const ans = numFront * numBack;

        let opts = [ans];
        while (opts.length < 3) {
            let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 10 : 1);
            let fake = Math.random() < 0.5 ? ans + offset : ans - offset;
            if (fake > 0 && !opts.includes(fake)) opts.push(fake);
        }
        opts.sort(() => Math.random() - 0.5);

        return { qText: `${numFront} × ${numBack} = ?`, ans, opts };
    }

    function startGame() {
        document.getElementById('setup-screen').classList.add('hidden');
        timeLeft = selectedTime;

        if (currentMode === 'single') {
            singleState.name = document.getElementById('p1-name-single').value.trim() || '小小建築師';
            singleState.height = 0; singleState.wrong = 0;

            document.getElementById('single-height').innerText = '0';
            document.getElementById('single-timer').innerText = selectedTime;
            document.getElementById('single-player-tag').innerHTML = parseBpmf(`建[ㄐㄧㄢˋ]築[ㄓㄨˊ]師[ㄕ]：${singleState.name}`);
            document.getElementById('single-house').innerHTML = '';

            document.getElementById('single-game-screen').classList.remove('hidden');
            nextSingleQuestion();

            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('single-timer').innerText = timeLeft;
                if (timeLeft <= 0) endSingleGame();
            }, 1000);

        } else {
            pvpState.p1.name = document.getElementById('p1-name-pvp').value.trim() || '建築師 1';
            pvpState.p2.name = document.getElementById('p2-name-pvp').value.trim() || '建築師 2';
            pvpState.p1.height = 0; pvpState.p1.wrong = 0;
            pvpState.p2.height = 0; pvpState.p2.wrong = 0;

            document.getElementById('p1-display-name').innerText = pvpState.p1.name;
            document.getElementById('p2-display-name').innerText = pvpState.p2.name;
            document.getElementById('p1-height').innerText = '0';
            document.getElementById('p2-height').innerText = '0';
            document.getElementById('p1-house').innerHTML = '';
            document.getElementById('p2-house').innerHTML = '';

            updatePvpTimer(selectedTime);
            document.getElementById('pvp-game-screen').classList.remove('hidden');

            nextPvpQuestion(1);
            nextPvpQuestion(2);

            timerId = setInterval(() => {
                timeLeft--;
                updatePvpTimer(timeLeft);
                if (timeLeft <= 0) endPvpGame();
            }, 1000);
        }
        renderAllBpmfText();
    }

    function updatePvpTimer(time) {
        document.getElementById('pvp-timer-desktop').innerText = time;
        document.getElementById('pvp-timer-mobile').innerText = time;
    }

    function addBlockToHouse(containerId) {
        const container = document.getElementById(containerId);
        const colorClass = COLORS[Math.floor(Math.random() * COLORS.length)];
        const block = document.createElement('div');
        block.className = `house-block ${colorClass}`;
        block.innerText = `🧱 ${container.children.length + 1}F`;
        container.appendChild(block);
        container.scrollTop = container.scrollHeight;
    }

    function removeBlockFromHouse(containerId, hammerId) {
        const container = document.getElementById(containerId);
        const hammer = document.getElementById(hammerId);

        if (hammer) {
            hammer.classList.remove('hammer-hit');
            void hammer.offsetWidth; 
            hammer.classList.add('hammer-hit');
        }

        if (container.children.length > 0) {
            const lastBlock = container.lastElementChild;
            lastBlock.classList.add('block-destroy');
            setTimeout(() => {
                if (lastBlock.parentNode === container) {
                    container.removeChild(lastBlock);
                }
            }, 350);
        }
    }

    function nextSingleQuestion() {
        singleState.hasErrored = false;
        const qData = generateQuestion();
        singleState.ans = qData.ans;

        document.getElementById('single-question').innerText = qData.qText;

        const btns = document.querySelectorAll('.single-opt');
        btns.forEach((b, i) => {
            b.innerText = qData.opts[i];
            b.className = 'single-opt btn-bubbly bg-orange-400 hover:bg-orange-500 text-white text-4xl sm:text-6xl font-black py-6 sm:py-8 rounded-3xl border-b-8 border-orange-600';
            b.disabled = false;
        });
    }

    function checkSingleAnswer(idx) {
        const btns = document.querySelectorAll('.single-opt');
        const chosen = parseInt(btns[idx].innerText);

        if (chosen === singleState.ans) {
            if (!singleState.hasErrored) {
                singleState.height++;
                document.getElementById('single-height').innerText = singleState.height;
                addBlockToHouse('single-house');
            }
            btns[idx].classList.add('btn-correct');
            setTimeout(nextSingleQuestion, 220);
        } else {
            singleState.wrong++;
            singleState.hasErrored = true;
            if (singleState.height > 0) singleState.height--;
            document.getElementById('single-height').innerText = singleState.height;

            removeBlockFromHouse('single-house', 'single-hammer');

            btns[idx].classList.add('btn-wrong');
            setTimeout(() => btns[idx].classList.remove('btn-wrong'), 500);
        }
    }

    function nextPvpQuestion(pNum) {
        const pState = (pNum === 1) ? pvpState.p1 : pvpState.p2;
        pState.errored = false;

        const qData = generateQuestion();
        pState.ans = qData.ans;

        document.getElementById(`p${pNum}-question`).innerText = qData.qText;

        const btns = document.querySelectorAll(`.p${pNum}-opt`);
        const bgStyle = pNum === 1 ? 'bg-rose-400 border-rose-600' : 'bg-teal-500 border-teal-700';

        btns.forEach((b, i) => {
            b.innerText = qData.opts[i];
            b.className = `p${pNum}-opt btn-bubbly ${bgStyle} text-white text-3xl sm:text-5xl font-black py-4 sm:py-6 rounded-2xl border-b-6`;
            b.disabled = false;
        });
    }

    function checkPvpAnswer(pNum, idx) {
        const pState = (pNum === 1) ? pvpState.p1 : pvpState.p2;
        const btns = document.querySelectorAll(`.p${pNum}-opt`);
        const chosen = parseInt(btns[idx].innerText);

        if (chosen === pState.ans) {
            if (!pState.errored) {
                pState.height++;
                document.getElementById(`p${pNum}-height`).innerText = pState.height;
                addBlockToHouse(`p${pNum}-house`);
            }
            btns[idx].classList.add('btn-correct');
            setTimeout(() => nextPvpQuestion(pNum), 200);
        } else {
            pState.wrong++;
            pState.errored = true;
            if (pState.height > 0) pState.height--;
            document.getElementById(`p${pNum}-height`).innerText = pState.height;

            removeBlockFromHouse(`p${pNum}-house`, `p${pNum}-hammer`);

            btns[idx].classList.add('btn-wrong');
            setTimeout(() => btns[idx].classList.remove('btn-wrong'), 500);
        }
    }

    function endSingleGame() {
        clearInterval(timerId);
        document.getElementById('single-game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('result-title').innerHTML = parseBpmf('蓋[ㄍㄞˋ]房[ㄈㄤˊ]子[ㄗ˙]挑[ㄊㄧㄠˇ]戰[ㄓㄢˋ]結[ㄐㄧㄝˊ]束[ㄕㄨˋ]');
        document.getElementById('winner-announcement').classList.add('hidden');

        document.getElementById('result-stats-box').innerHTML = `
            <div class="text-orange-950 font-bold border-b pb-2">
                <span class="bpmf-text">建[ㄐㄧㄢˋ]築[ㄓㄨˊ]師[ㄕ]：</span><span class="text-orange-600">${singleState.name}</span>
            </div>
            <div class="flex justify-between items-center text-emerald-700">
                <span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]總[ㄗㄨㄥˇ]高[ㄍㄠ]度[ㄉㄨˋ]：</span>
                <span class="font-black text-4xl">🏠 ${singleState.height} <span class="text-lg bpmf-text">層[ㄘㄥˊ]</span></span>
            </div>
            <div class="flex justify-between items-center text-rose-600">
                <span class="bpmf-text">答[ㄉㄚˊ]錯[ㄘㄨㄛˋ]（槌[ㄔㄨㄟˊ]子[ㄗ˙]敲[ㄑㄧㄠ]碎[ㄙㄨㄟˋ]）：</span>
                <span class="font-black text-4xl">🔨 ${singleState.wrong} <span class="text-lg bpmf-text">次[ㄘˋ]</span></span>
            </div>
        `;
        renderAllBpmfText();
    }

    function endPvpGame() {
        clearInterval(timerId);
        document.getElementById('pvp-game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('result-title').innerHTML = parseBpmf('對[ㄉㄨˋ]建[ㄐㄧㄢˋ]結[ㄐㄧㄝˊ]果[ㄍㄨㄛˊ]');
        const announceBox = document.getElementById('winner-announcement');
        announceBox.classList.remove('hidden');

        const p1 = pvpState.p1;
        const p2 = pvpState.p2;

        if (p1.height > p2.height) {
            announceBox.innerHTML = parseBpmf(`👑 恭[ㄍㄨㄥ]喜[ㄒㄧ] <span class="text-rose-600">${p1.name}</span> 蓋[ㄍㄞˋ]出[ㄔㄨ]最[ㄗㄨㄟˋ]高[ㄍㄠ]的[ㄉㄜ˙]房[ㄈㄤˊ]子[ㄗ˙]！ 🎉`);
        } else if (p2.height > p1.height) {
            announceBox.innerHTML = parseBpmf(`👑 恭[ㄍㄨㄥ]喜[ㄒㄧ] <span class="text-teal-600">${p2.name}</span> 蓋[ㄍㄞˋ]出[ㄔㄨ]最[ㄗㄨㄟˋ]高[ㄍㄠ]的[ㄉㄜ˙]房[ㄈㄤˊ]子[ㄗ˙]！ 🎉`);
        } else {
            announceBox.innerHTML = parseBpmf(`🤝 兩[ㄌㄧㄤˇ]位[ㄨㄟˋ]蓋[ㄍㄞˋ]得[ㄉㄜ˙]一[ㄧ]樣[ㄧㄤˋ]高[ㄍㄠ]！平[ㄆㄧㄥˊ]手[ㄕㄡˇ]！`);
        }

        document.getElementById('result-stats-box').innerHTML = `
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-rose-50 p-4 rounded-2xl border-2 border-rose-200">
                    <div class="font-bold text-rose-800 text-2xl mb-1">${p1.name}</div>
                    <div class="text-rose-600 text-xl"><span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]：</span><span class="text-4xl font-black">🏠 ${p1.height} 層</span></div>
                    <div class="text-gray-500 text-base mt-1"><span class="bpmf-text">槌[ㄔㄨㄟˊ]打[ㄉㄚˇ]：</span>${p1.wrong} <span class="bpmf-text">次[ㄘˋ]</span></div>
                </div>
                <div class="bg-teal-50 p-4 rounded-2xl border-2 border-teal-200">
                    <div class="font-bold text-teal-800 text-2xl mb-1">${p2.name}</div>
                    <div class="text-teal-600 text-xl"><span class="bpmf-text">房[ㄈㄤˊ]子[ㄗ˙]：</span><span class="text-4xl font-black">🏠 ${p2.height} 層</span></div>
                    <div class="text-gray-500 text-base mt-1"><span class="bpmf-text">槌[ㄔㄨㄟˊ]打[ㄉㄚˇ]：</span>${p2.wrong} <span class="bpmf-text">次[ㄘˋ]</span></div>
                </div>
            </div>
        `;
        renderAllBpmfText();
    }

    function resetToHome() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        renderAllBpmfText();
    }

    window.onload = function() {
        document.getElementById('main-title').innerHTML = parseBpmf('乘[ㄔㄥˊ]法[ㄈㄚˇ]蓋[ㄍㄞˋ]房[ㄈㄤˊ]子[ㄗ˙]大[ㄉㄚˋ]挑[ㄊㄧㄠˇ]戰[ㄓㄢˋ]');
        renderAllBpmfText();
    };
</script>
</body>
</html>
