<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直式乘法學習單生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Print & A4 Page Styling */
        @media screen {
            .a4-page-preview {
                width: 210mm;
                min-height: 297mm;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
                background-color: #ffffff;
                margin: 0 auto 2rem auto;
                padding: 12mm 15mm;
                box-sizing: border-box;
                position: relative;
                font-family: "BiauKai", "標楷體", "DFKai-SB", "Kaiti SC", "KaiTi", serif;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                font-family: "BiauKai", "標楷體", "DFKai-SB", "Kaiti SC", "KaiTi", serif !important;
            }
            .no-print {
                display: none !important;
            }
            .a4-page-preview {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 12mm 15mm !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
                break-after: page;
                box-sizing: border-box;
                position: relative;
                overflow: hidden;
                font-family: "BiauKai", "標楷體", "DFKai-SB", "Kaiti SC", "KaiTi", serif !important;
            }
            .a4-page-preview:last-child {
                page-break-after: avoid;
                break-after: avoid;
            }
            /* Hide hover action buttons in print */
            .problem-actions {
                display: none !important;
            }
        }

        /* Calculation Grid Styling */
        .math-grid {
            border-collapse: collapse;
            margin: 0 auto;
        }
        .math-cell {
            border: 1px solid #94a3b8;
            width: 1.85rem;
            height: 2.2rem;
            text-align: center;
            vertical-align: middle;
            font-size: 1.35rem;
            font-weight: 600;
            font-family: "BiauKai", "標楷體", "DFKai-SB", "Kaiti SC", "KaiTi", 'Courier New', Courier, monospace;
            position: relative;
        }
        .border-bottom-thick {
            border-bottom: 2.5px solid #0f172a !important;
        }

        /* Number Input Custom Spin Removal */
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type='number'] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="no-print bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 p-2 rounded-lg text-white font-bold text-xl flex items-center justify-center w-10 h-10">
                    <i class="fa-solid font-mono text-2xl">×</i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">直式計算練習單生成器</h1>
                    <p class="text-xs text-slate-400">客製化多位數乘法練習單與學習網格</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
                <button id="btn-generate" onclick="generateAllQuestions()" class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold px-4 py-2 rounded-lg shadow flex items-center gap-2 transition duration-150 text-sm">
                    <i class="fa-solid fa-rotate"></i> 重新產生題目
                </button>
                <button id="btn-toggle-answer" onclick="toggleAnswerKey()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-4 py-2 rounded-lg shadow flex items-center gap-2 transition duration-150 text-sm">
                    <i class="fa-solid fa-file-circle-check"></i> <span id="answer-toggle-text">加入解答頁</span>
                </button>
                <button onclick="window.print()" class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white font-bold px-5 py-2 rounded-lg shadow flex items-center gap-2 transition duration-150 text-sm">
                    <i class="fa-solid fa-print"></i> 列印 / 另存PDF
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Workspace -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <!-- Left Sidebar Options Panel -->
        <aside class="no-print w-full lg:w-80 flex-shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-6 h-fit sticky lg:top-20">
            <div>
                <h2 class="text-base font-bold text-slate-900 border-b border-slate-200 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brand-500"></i> 題目屬性設定
                </h2>
                
                <div class="mt-4 space-y-4 text-sm">
                    <!-- Multiplicand & Multiplier Digits -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">被乘數 (上)</label>
                            <select id="multiplicand-digits" onchange="generateAllQuestions()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <option value="1">1 位數</option>
                                <option value="2" selected>2 位數</option>
                                <option value="3">3 位數</option>
                                <option value="4">4 位數</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">乘數 (下)</label>
                            <select id="multiplier-digits" onchange="generateAllQuestions()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <option value="1">1 位數</option>
                                <option value="2" selected>2 位數</option>
                                <option value="3">3 位數</option>
                                <option value="4">4 位數</option>
                            </select>
                        </div>
                    </div>

                    <!-- Total Questions & Layout -->
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">題目總數量</label>
                        <input type="number" id="total-questions" value="6" min="1" max="48" onchange="generateAllQuestions()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">每頁題數</label>
                            <select id="questions-per-page" onchange="updateLayout()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <option value="4">4 題</option>
                                <option value="6" selected>6 題</option>
                                <option value="8">8 題</option>
                                <option value="9">9 題</option>
                                <option value="12">12 題</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">直欄數量</label>
                            <select id="page-columns" onchange="updateLayout()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                                <option value="2">2 欄</option>
                                <option value="3" selected>3 欄</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Global Grid Controls -->
            <div class="pt-2 border-t border-slate-200">
                <h2 class="text-base font-bold text-slate-900 border-b border-slate-200 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-table-cells text-brand-500"></i> 計算格子設定
                </h2>

                <div class="mt-4 space-y-4 text-sm">
                    <div class="flex items-center justify-between">
                        <span class="font-medium text-slate-700">網格欄數 (寬)</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="adjustGlobalGridCols(-1)" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 font-bold active:scale-95 flex items-center justify-center">-</button>
                            <span id="global-cols-val" class="w-6 text-center font-bold text-slate-800">5</span>
                            <button onclick="adjustGlobalGridCols(1)" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 font-bold active:scale-95 flex items-center justify-center">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="font-medium text-slate-700">網格列數 (高)</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="adjustGlobalGridRows(-1)" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 font-bold active:scale-95 flex items-center justify-center">-</button>
                            <span id="global-rows-val" class="w-6 text-center font-bold text-slate-800">8</span>
                            <button onclick="adjustGlobalGridRows(1)" class="w-8 h-8 rounded-lg bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 font-bold active:scale-95 flex items-center justify-center">+</button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <label for="fill-numbers-toggle" class="font-medium text-slate-700 cursor-pointer">預先填入被乘數與乘數</label>
                        <input type="checkbox" id="fill-numbers-toggle" checked onchange="updateLayout()" class="w-4 h-4 text-brand-500 rounded focus:ring-brand-500 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Worksheet Header & Customization -->
            <div class="pt-2 border-t border-slate-200">
                <h2 class="text-base font-bold text-slate-900 border-b border-slate-200 pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-heading text-brand-500"></i> 標題與頁首欄位
                </h2>

                <div class="mt-4 space-y-3 text-sm">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">練習單標題</label>
                        <input type="text" id="worksheet-title" value="直式計算練習" oninput="updateHeaderInfo()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>

                    <div class="space-y-2 pt-1">
                        <label class="flex items-center gap-2 text-slate-700 font-medium cursor-pointer">
                            <input type="checkbox" id="show-name" checked onchange="updateHeaderInfo()" class="w-4 h-4 text-brand-500 rounded">
                            顯示「姓名」欄位
                        </label>
                        <label class="flex items-center gap-2 text-slate-700 font-medium cursor-pointer">
                            <input type="checkbox" id="show-seat" checked onchange="updateHeaderInfo()" class="w-4 h-4 text-brand-500 rounded">
                            顯示「座號」欄位
                        </label>
                        <label class="flex items-center gap-2 text-slate-700 font-medium cursor-pointer">
                            <input type="checkbox" id="show-score" checked onchange="updateHeaderInfo()" class="w-4 h-4 text-brand-500 rounded">
                            顯示「分數」欄位
                        </label>
                    </div>
                </div>
            </div>

            <div class="p-3 bg-sky-50 rounded-lg border border-sky-200 text-xs text-sky-800 space-y-1">
                <p class="font-bold flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> 提示說明</p>
                <p>列印時請在瀏覽器列印設定中，將「邊界」設定為<b>「無」</b>或<b>「預設」</b>，並勾選<b>「背景圖形」</b>以確保格子線條完美顯示。</p>
            </div>
        </aside>

        <!-- Right Side: A4 Worksheet Pages Workspace -->
        <main class="flex-1 overflow-x-auto pb-12">
            <div id="worksheet-container" class="flex flex-col items-center">
                <!-- Pages will be rendered dynamically here -->
            </div>
        </main>

    </div>

    <!-- Website Bottom Footer -->
    <footer class="no-print bg-slate-900 text-slate-400 py-4 text-center text-sm border-t border-slate-800">
        <p>直式計算練習單生成器 ｜ 玉珽老師的遊戲教室 編</p>
    </footer>

    <script>
        // Global Application State
        let questionsData = [];
        let globalCols = 5;
        let globalRows = 8;
        let showAnswerKey = false;

        // Initialize default configuration
        window.addEventListener('DOMContentLoaded', () => {
            generateAllQuestions();
        });

        // Generate random integer in range [min, max]
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Generate numbers by specified digit count
        function generateNumberByDigits(digits) {
            if (digits === 1) return getRandomInt(2, 9);
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            return getRandomInt(min, max);
        }

        // Master function to generate questions
        function generateAllQuestions() {
            const multiplicandDigits = parseInt(document.getElementById('multiplicand-digits').value, 10);
            const multiplierDigits = parseInt(document.getElementById('multiplier-digits').value, 10);
            const total = parseInt(document.getElementById('total-questions').value, 10) || 6;

            // Update default grid size based on digit count
            const requiredCols = Math.max(multiplicandDigits + multiplierDigits + 1, multiplicandDigits + 2, 5);
            const requiredRows = multiplierDigits + multiplicandDigits + 3;

            globalCols = Math.max(requiredCols, 5);
            globalRows = Math.max(requiredRows, 7);

            document.getElementById('global-cols-val').innerText = globalCols;
            document.getElementById('global-rows-val').innerText = globalRows;

            questionsData = [];
            for (let i = 0; i < total; i++) {
                const num1 = generateNumberByDigits(multiplicandDigits);
                const num2 = generateNumberByDigits(multiplierDigits);
                questionsData.push({
                    id: i + 1,
                    num1: num1,
                    num2: num2,
                    answer: num1 * num2,
                    cols: globalCols,
                    rows: globalRows
                });
            }

            renderWorksheetPages();
        }

        function adjustGlobalGridCols(delta) {
            globalCols = Math.max(3, Math.min(10, globalCols + delta));
            document.getElementById('global-cols-val').innerText = globalCols;
            questionsData.forEach(q => q.cols = globalCols);
            renderWorksheetPages();
        }

        function adjustGlobalGridRows(delta) {
            globalRows = Math.max(4, Math.min(15, globalRows + delta));
            document.getElementById('global-rows-val').innerText = globalRows;
            questionsData.forEach(q => q.rows = globalRows);
            renderWorksheetPages();
        }

        function adjustQuestionGridCols(qIndex, delta) {
            if (questionsData[qIndex]) {
                questionsData[qIndex].cols = Math.max(3, Math.min(10, questionsData[qIndex].cols + delta));
                renderWorksheetPages();
            }
        }

        function adjustQuestionGridRows(qIndex, delta) {
            if (questionsData[qIndex]) {
                questionsData[qIndex].rows = Math.max(4, Math.min(15, questionsData[qIndex].rows + delta));
                renderWorksheetPages();
            }
        }

        function regenerateSingleQuestion(qIndex) {
            const multiplicandDigits = parseInt(document.getElementById('multiplicand-digits').value, 10);
            const multiplierDigits = parseInt(document.getElementById('multiplier-digits').value, 10);
            
            const num1 = generateNumberByDigits(multiplicandDigits);
            const num2 = generateNumberByDigits(multiplierDigits);
            
            questionsData[qIndex].num1 = num1;
            questionsData[qIndex].num2 = num2;
            questionsData[qIndex].answer = num1 * num2;
            renderWorksheetPages();
        }

        function toggleAnswerKey() {
            showAnswerKey = !showAnswerKey;
            const btnText = document.getElementById('answer-toggle-text');
            const btn = document.getElementById('btn-toggle-answer');
            
            if (showAnswerKey) {
                btnText.innerText = "移除解答頁";
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                btn.classList.add('bg-rose-600', 'hover:bg-rose-700');
            } else {
                btnText.innerText = "加入解答頁";
                btn.classList.remove('bg-rose-600', 'hover:bg-rose-700');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }
            renderWorksheetPages();
        }

        function updateLayout() {
            renderWorksheetPages();
        }

        function updateHeaderInfo() {
            const title = document.getElementById('worksheet-title').value || "直式計算練習";
            const showName = document.getElementById('show-name').checked;
            const showSeat = document.getElementById('show-seat').checked;
            const showScore = document.getElementById('show-score').checked;

            document.querySelectorAll('.render-title').forEach(el => el.innerText = title);
            document.querySelectorAll('.render-name').forEach(el => el.style.display = showName ? 'inline' : 'none');
            document.querySelectorAll('.render-seat').forEach(el => el.style.display = showSeat ? 'inline' : 'none');
            document.querySelectorAll('.render-score').forEach(el => el.style.display = showScore ? 'inline' : 'none');
        }

        function createGridHTML(q, qIndex, isAnswerSheet = false) {
            const fillNumbers = document.getElementById('fill-numbers-toggle').checked;
            const num1Str = q.num1.toString();
            const num2Str = q.num2.toString();
            const cols = q.cols;
            const rows = q.rows;

            let html = `<table class="math-grid">`;

            for (let r = 0; r < rows; r++) {
                const isSecondRow = (r === 1);
                const rowClass = isSecondRow ? 'border-bottom-thick' : '';
                html += `<tr class="${rowClass}">`;

                for (let c = 0; c < cols; c++) {
                    let cellChar = '';

                    if (fillNumbers) {
                        // Row 0: Multiplicand aligned to the right
                        if (r === 0) {
                            const charIdx = num1Str.length - (cols - c);
                            if (charIdx >= 0) {
                                cellChar = num1Str[charIdx];
                            }
                        }
                        // Row 1: Multiplier aligned to right, '×' placed at the leftmost column (c === 0)
                        else if (r === 1) {
                            const charIdx = num2Str.length - (cols - c);
                            if (charIdx >= 0) {
                                cellChar = num2Str[charIdx];
                            } else if (c === 0) {
                                cellChar = '×';
                            }
                        }
                    }

                    // Answer key mode: render answer steps or final answer if requested
                    if (isAnswerSheet) {
                        // If answer key mode, fill answer at bottom row
                        if (r === rows - 1) {
                            const ansStr = q.answer.toString();
                            const ansCharIdx = ansStr.length - (cols - c);
                            if (ansCharIdx >= 0) {
                                cellChar = `<span class="text-rose-600 font-bold">${ansStr[ansCharIdx]}</span>`;
                            }
                        }
                    }

                    html += `<td class="math-cell">${cellChar}</td>`;
                }
                html += `</tr>`;
            }

            html += `</table>`;
            return html;
        }

        function renderWorksheetPages() {
            const container = document.getElementById('worksheet-container');
            container.innerHTML = '';

            const questionsPerPage = parseInt(document.getElementById('questions-per-page').value, 10);
            const colsCount = parseInt(document.getElementById('page-columns').value, 10);
            const totalQuestions = questionsData.length;
            const totalStudentPages = Math.ceil(totalQuestions / questionsPerPage);

            // Determine grid CSS class based on page column setting
            const gridColClass = colsCount === 2 ? 'grid-cols-2 gap-x-8 gap-y-6' : 'grid-cols-3 gap-x-5 gap-y-6';

            // Function to generate page template
            const renderPage = (pageIdx, totalPages, isAnswerSheet = false) => {
                const pageElement = document.createElement('div');
                pageElement.className = 'a4-page-preview text-slate-900 flex flex-col justify-between';

                const startIdx = pageIdx * questionsPerPage;
                const pageQuestions = questionsData.slice(startIdx, startIdx + questionsPerPage);

                const titleText = document.getElementById('worksheet-title').value || "直式計算練習";
                const showName = document.getElementById('show-name').checked;
                const showSeat = document.getElementById('show-seat').checked;
                const showScore = document.getElementById('show-score').checked;

                let pageHTML = `
                    <div>
                        <!-- Header Section -->
                        <div class="mb-4 text-center border-b pb-3">
                            <h2 class="text-2xl font-bold tracking-wide render-title">
                                ${titleText} ${isAnswerSheet ? '<span class="text-rose-600 ml-2">(解答頁)</span>' : ''}
                            </h2>
                            <div class="flex justify-end gap-6 text-sm font-medium mt-2 px-2">
                                <span class="render-name" style="display: ${showName ? 'inline' : 'none'};">姓名：______________</span>
                                <span class="render-seat" style="display: ${showSeat ? 'inline' : 'none'};">座號：________</span>
                                <span class="render-score" style="display: ${showScore ? 'inline' : 'none'};">分數：________</span>
                            </div>
                        </div>

                        <!-- Questions Grid Container -->
                        <div class="grid ${gridColClass} items-start">
                `;

                pageQuestions.forEach((q, idx) => {
                    const qRealIndex = startIdx + idx;
                    const displayAns = isAnswerSheet ? `<span class="text-rose-600 underline font-bold ml-1">${q.answer}</span>` : '_______';

                    pageHTML += `
                        <div class="problem-card relative p-2 border border-transparent rounded-lg hover:border-slate-300 transition-all group">
                            <!-- Direct Interactive Quick Actions (Hidden in print) -->
                            <div class="no-print problem-actions absolute -top-3 right-0 bg-white border border-slate-300 shadow-sm rounded-md px-1 py-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-1 text-xs z-10 font-sans">
                                <button onclick="adjustQuestionGridRows(${qRealIndex}, 1)" title="增加一列" class="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold">+列</button>
                                <button onclick="adjustQuestionGridRows(${qRealIndex}, -1)" title="減少一列" class="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold">-列</button>
                                <button onclick="adjustQuestionGridCols(${qRealIndex}, 1)" title="增加一行" class="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold">+行</button>
                                <button onclick="adjustQuestionGridCols(${qRealIndex}, -1)" title="減少一行" class="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 rounded text-slate-700 font-bold">-行</button>
                                <button onclick="regenerateSingleQuestion(${qRealIndex})" title="換一題" class="px-1.5 py-0.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded font-bold"><i class="fa-solid fa-arrows-rotate"></i></button>
                            </div>

                            <!-- Question Equation Header -->
                            <div class="font-bold text-base mb-2 flex items-center gap-1">
                                <span>(${q.id})</span>
                                <span>${q.num1} × ${q.num2} = ${displayAns}</span>
                            </div>

                            <!-- Math Calculation Grid -->
                            <div class="flex justify-center">
                                ${createGridHTML(q, qRealIndex, isAnswerSheet)}
                            </div>
                        </div>
                    `;
                });

                pageHTML += `
                        </div>
                    </div>

                    <!-- Footer Page Number & Credit -->
                    <div class="flex justify-between items-center text-xs text-slate-600 pt-2 border-t border-slate-200 mt-4">
                        <span class="font-bold">玉珽老師的遊戲教室</span>
                        <span>第 ${pageIdx + 1} / ${totalPages} 頁</span>
                    </div>
                `;

                pageElement.innerHTML = pageHTML;
                container.appendChild(pageElement);
            };

            // Render Student Practice Pages
            for (let p = 0; p < totalStudentPages; p++) {
                renderPage(p, totalStudentPages, false);
            }

            // Render Answer Key Pages if enabled
            if (showAnswerKey) {
                for (let p = 0; p < totalStudentPages; p++) {
                    renderPage(p, totalStudentPages, true);
                }
            }
        }
    </script>
</body>
</html>
