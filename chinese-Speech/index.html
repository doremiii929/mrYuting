<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>辨識詞性</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap">
<style>
/* Layout: a fixed 960x540 stage that is scaled as one piece to fit any screen (letterboxed), so nothing reflows between phone and desktop. 1P uses the full stage; 2P splits it into two 480px halves. Each word type owns one colour (noun blue, verb green, adjective orange). Single arcade look by choice, so every colour is set explicitly. */
:root{
  --line:#1a1240; --bg:#0f0a2e; --sky:#86e4ff;
  --water:#1f8bff; --water-hi:#63c8ff;
  --wood:#e8963c;
  --noun:#2f7bff; --verb:#1fc65a; --adj:#ff7a1a;
  --heart:#ff3b5c; --star:#ffd21f; --danger:#ff2e2e; --paper:#ffffff;
  --p1:#2f7bff; --p2:#ff4fa3;
  --f-text:'DotGothic16','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-num:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--line);font-family:var(--f-text);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;
}
.px{image-rendering:crisp-edges;image-rendering:pixelated}
#fit{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;margin:-270px 0 0 -480px;
  transform:scale(var(--s,1));transform-origin:center center;background:var(--sky);overflow:hidden;box-shadow:0 0 0 4px var(--line)}
#rot{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;font-size:14px;line-height:1.5}
.screen{position:absolute;inset:0}
:focus-visible{outline:4px solid var(--star);outline-offset:2px}
button{font-family:inherit}

.pbox{background:var(--paper);
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 8px 0 0 rgba(26,18,64,.35)}
.btn{font-family:var(--f-num);font-size:20px;padding:14px 26px;margin:8px;border:0;cursor:pointer;
  background:var(--b,var(--star));color:var(--line);
  box-shadow:inset 0 -6px 0 0 rgba(0,0,0,.18),inset 0 4px 0 0 rgba(255,255,255,.55),0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),0 8px 0 0 rgba(26,18,64,.35)}
.btn.zh{font-family:var(--f-text);font-size:28px;padding:12px 30px}
.btn:active{transform:translateY(4px)}
.mini{font-size:14px;padding:6px 12px;margin:4px;border:0;cursor:pointer;background:var(--paper);color:var(--line);
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#mute{position:absolute;left:8px;top:8px;z-index:150;width:40px;height:40px;padding:0;border:0;cursor:pointer;background:var(--paper);color:var(--line);font-size:24px;line-height:40px;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
#mute.off{background:#c9c4e6;color:#6b6590;text-decoration:line-through}

.cloud{position:absolute;width:80px;height:16px;background:#fff;animation:drift 60s linear infinite}
.cloud::before{content:"";position:absolute;left:16px;top:-16px;width:32px;height:16px;background:#fff}
.cloud::after{content:"";position:absolute;left:44px;top:-8px;width:24px;height:8px;background:#fff}
.c1{top:70px;left:0}
.c2{top:150px;left:0;animation-duration:85s;animation-delay:-30s;transform:scale(.8)}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(1100px)}}

/* intro */
.title{position:absolute;top:12px;left:0;right:0;margin:0;font-weight:400;font-size:84px;line-height:96px;display:flex;justify-content:center;gap:8px}
.title span{color:var(--c);
  text-shadow:4px 0 0 var(--line),-4px 0 0 var(--line),0 4px 0 var(--line),0 -4px 0 var(--line),4px 4px 0 var(--line),-4px 4px 0 var(--line),4px -4px 0 var(--line),-4px -4px 0 var(--line),0 10px 0 var(--line);
  animation:bob 1.2s steps(2) infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes bob{50%{transform:translateY(-8px)}}
#spkRow{position:absolute;top:116px;left:0;right:0;height:180px;display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:0 36px}
.spk{display:flex;align-items:flex-end;gap:14px;flex:1 1 0;max-width:780px;min-width:0}
.spk img{width:150px;height:150px;flex:none}
.spk .bubble{flex:1;min-width:0;min-height:90px;padding:12px 16px;margin-bottom:14px;font-size:20px;line-height:1.6}
.spk.two{max-width:440px}
.spk.two img{width:118px;height:118px}
.spk.two .bubble{font-size:17px;padding:10px 12px;min-height:80px}
#ctrl{position:absolute;top:304px;left:0;right:0;height:66px;display:flex;justify-content:center;align-items:center;gap:24px}
.legend{position:absolute;top:382px;left:24px;right:24px;display:flex;justify-content:center;gap:12px;list-style:none;margin:0;padding:0}
.chip{flex:1 1 0;max-width:300px;padding:8px 12px;background:var(--paper);font-size:14px;line-height:1.5;text-align:left;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.chip b{display:inline-block;background:var(--c);color:#fff;padding:1px 8px;margin-right:6px;font-weight:400}
.deco-pond{position:absolute;left:0;right:0;bottom:0;height:80px;border-top:4px solid var(--line);overflow:hidden;
  background:linear-gradient(var(--water-hi) 0 14%,var(--water) 14% 100%)}
.deco{position:absolute;height:60px;width:120px;animation:swim 18s linear infinite}
@keyframes swim{from{transform:translateX(-170px)}to{transform:translateX(1100px)}}

/* game */
#game{overflow:hidden}
.side{position:absolute;top:0;height:540px;overflow:hidden}
.hud{position:absolute;left:0;right:0;top:0;height:52px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.m1 .hud{padding:0 12px 0 60px}
.m2 .s0 .hud{padding:0 68px 0 60px}
.m2 .s1 .hud{padding:0 12px 0 68px}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-weight:400;font-size:24px;white-space:nowrap}
.who.brand{text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff}
.who.p0,.who.p1{font-family:var(--f-num);font-size:16px;color:#fff;padding:6px 10px;background:var(--p1);
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.who.p1{background:var(--p2)}
.score{font-size:18px;background:var(--paper);padding:3px 10px;white-space:nowrap;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}
.score i{font-style:normal;font-family:var(--f-num);font-size:16px}
.hearts{display:flex;gap:4px;flex:none}
.heart{width:34px;height:auto;display:block}
.heart.pop{animation:heartpop .6s steps(6)}
@keyframes heartpop{0%{transform:scale(1.8)}50%{transform:scale(.6) rotate(-14deg)}100%{transform:none}}
#timer{position:absolute;top:8px;z-index:20;font-family:var(--f-num);font-size:18px;background:var(--line);color:#fff;padding:10px 12px;width:104px;text-align:center;
  box-shadow:0 -4px 0 0 #fff,0 4px 0 0 #fff,-4px 0 0 0 #fff,4px 0 0 0 #fff}
.m1 #timer{right:156px}
.m2 #timer{left:50%;margin-left:-52px}
#timer.low{color:var(--danger);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:#5a0f1f}}
#divider{position:absolute;left:476px;top:0;width:8px;height:540px;background:var(--line);z-index:15}
.bossrow{position:absolute;left:10px;right:10px;top:54px;height:112px;display:flex;align-items:flex-end;gap:12px}
.bossimg{width:104px;height:104px;flex:none}
.bossimg.bounce{animation:hop .5s steps(4)}
@keyframes hop{30%{transform:translateY(-18px)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.bossrow .bubble{flex:1;min-width:0;min-height:64px;margin-bottom:12px;padding:8px 14px;font-size:19px;line-height:1.5}
.m2 .bossrow .bubble{font-size:16px;padding:8px 10px}
.pond{position:absolute;left:10px;right:10px;top:170px;height:232px;overflow:hidden;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 4px,transparent 4px 44px),linear-gradient(var(--water-hi) 0 10%,var(--water) 10% 100%);
  box-shadow:0 0 0 4px var(--line)}
.bub{position:absolute;bottom:-12px;width:8px;height:8px;background:rgba(255,255,255,.55);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-260px)}}
.layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.fish{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;cursor:grab;will-change:transform}
.fb{display:block;width:100%;height:100%}
.ft{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;padding-top:4px;white-space:nowrap;color:var(--line);pointer-events:none}
.fish.held{cursor:grabbing;z-index:9}
.fish.held .fb{filter:drop-shadow(0 8px 0 rgba(26,18,64,.4))}
.fish.sel .fb{filter:drop-shadow(0 0 6px #fff);animation:blink2 .6s steps(2) infinite}
@keyframes blink2{50%{filter:brightness(1.25) drop-shadow(0 0 8px #fff)}}
.dock{position:absolute;left:0;right:0;top:410px;height:130px;z-index:4;display:flex;justify-content:center;align-items:center;gap:40px;
  background:var(--wood);border-top:4px solid var(--line);box-shadow:inset 0 6px 0 0 #f5b868;
  background-image:repeating-linear-gradient(90deg,transparent 0 116px,rgba(0,0,0,.16) 116px 120px)}
.m2 .dock{gap:14px}
.bucket{flex:none;width:140px;position:relative;background:none;border:0;padding:0;cursor:pointer;transition:transform .1s steps(2)}
.m2 .bucket{width:128px}
.bucket.hot{transform:translateY(-10px) scale(1.07)}
.bimg{display:block;width:100%;height:auto}
.blabel{position:absolute;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;pointer-events:none;
  text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px -2px 0 var(--line)}
.blabel b{font-weight:400;font-size:26px}
.blabel small{font-size:12px}
.m2 .blabel b{font-size:22px}
.m2 .blabel small{font-size:11px}
.pop{position:absolute;z-index:12;font-family:var(--f-num);font-size:22px;color:#fff;pointer-events:none;
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line);animation:floatup .8s steps(8) forwards}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.outmask{position:absolute;inset:0;z-index:8;background:rgba(26,18,64,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center}
.outmask b{font-weight:400;font-size:48px}
.outmask span{font-size:20px}

/* angry overlay (inside the stage, full stage) */
.overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--danger);animation:flash .18s steps(2) infinite}
@keyframes flash{50%{background:#b80000}}
.rays{position:absolute;left:50%;top:50%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;
  background:repeating-conic-gradient(rgba(120,0,0,.45) 0 7.5deg,transparent 7.5deg 15deg);animation:spin 2.4s steps(12) infinite}
@keyframes spin{to{transform:rotate(15deg)}}
.ov-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ov-tag{font-family:var(--f-num);font-size:20px;color:#fff;background:var(--line);padding:8px 14px}
.zoom{animation:zoomin .32s steps(6) both}
@keyframes zoomin{from{transform:translate(-300px,240px) scale(.12)}to{transform:none}}
.bigboss{display:block;width:250px;height:250px;animation:shake .14s steps(2) infinite .32s}
@keyframes shake{0%{transform:translate(-10px,4px) rotate(-1.5deg)}50%{transform:translate(10px,-4px) rotate(1.5deg)}100%{transform:translate(-6px,-6px)}}
.yell{margin:4px;padding:4px 18px;font-size:50px;line-height:1.2;color:#fff;background:none;box-shadow:none;
  text-shadow:4px 0 0 var(--line),-4px 0 0 var(--line),0 4px 0 var(--line),0 -4px 0 var(--line),4px 4px 0 var(--line),-4px 4px 0 var(--line),4px -4px 0 var(--line),-4px -4px 0 var(--line)}
.fix{font-size:24px;padding:10px 16px;line-height:1.6}
.badge{display:inline-block;background:var(--c);color:#fff;padding:0 10px;margin:0 2px}
.ov-hearts{display:flex;gap:6px}

/* result */
.res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.stars{display:flex;justify-content:center;gap:12px}
.star{width:76px;height:auto;display:block}
.stars.sm .star{width:50px}
.star.on{animation:starpop .5s steps(5) both}
@keyframes starpop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:none}}
.res-title{margin:0;font-weight:400;font-size:44px;line-height:1.2;color:#fff;
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px -3px 0 var(--line),3px -3px 0 var(--line),-3px 3px 0 var(--line)}
.res-main{display:flex;gap:24px;align-items:center;justify-content:center;width:840px}
.res-boss{display:flex;align-items:flex-end;gap:14px;flex:1;min-width:0}
.res-boss img{width:150px;height:150px;flex:none}
.res-boss .bubble{flex:1;min-width:0;padding:12px 16px;margin-bottom:14px;font-size:20px;line-height:1.6;min-height:90px}
.stats{flex:none;width:230px;padding:16px 18px;display:grid;gap:14px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat span{font-size:16px}
.stat b{font-family:var(--f-num);font-weight:400;font-size:24px}
.stat em{font-style:normal;font-size:14px;margin-left:4px}
.cols{display:flex;gap:24px;justify-content:center}
.col{width:432px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.col.win{background:#fff6bf}
.col .who{font-size:16px}
.col .rb{display:flex;align-items:flex-end;gap:10px;width:100%}
.col .rb img{width:104px;height:104px;flex:none}
.col .rb .bubble{flex:1;min-width:0;padding:8px 12px;margin-bottom:10px;font-size:16px;line-height:1.5;min-height:60px}
.col .st{display:flex;gap:20px;font-size:17px;align-items:baseline}
.col .st b{font-family:var(--f-num);font-weight:400;font-size:18px}
.wintag{position:absolute;right:10px;top:10px;font-family:var(--f-num);font-size:14px;background:var(--star);color:var(--line);padding:6px 8px}
@media (prefers-reduced-motion:reduce){
  .overlay,.rays,.bigboss,.title span,.cloud,.deco,.bub,#timer.low,.fish.sel .fb{animation:none}
}
</style>

<div id="fit">
<main id="stage" class="m1">
  <section class="screen" id="intro">
    <i class="cloud c1" aria-hidden="true"></i><i class="cloud c2" aria-hidden="true"></i>
    <h1 class="title" aria-label="辨識詞性">
      <span style="--c:var(--noun);--i:0">辨</span><span style="--c:var(--verb);--i:1">識</span><span style="--c:var(--adj);--i:2">詞</span><span style="--c:#ff4fa3;--i:3">性</span>
    </h1>
    <div id="spkRow" aria-live="polite"></div>
    <div id="ctrl"></div>
    <ul class="legend">
      <li class="chip" style="--c:var(--noun)"><b>名詞</b>人、事、物的名字，例如：貓咪</li>
      <li class="chip" style="--c:var(--verb)"><b>動詞</b>做的動作，例如：跑步</li>
      <li class="chip" style="--c:var(--adj)"><b>形容詞</b>描述樣子或感覺，例如：胖胖的</li>
    </ul>
    <div class="deco-pond" id="decoPond" aria-hidden="true"></div>
  </section>

  <section class="screen" id="game" hidden></section>
  <section class="screen" id="result" hidden></section>

  <div id="timer" hidden aria-label="剩餘時間">1:30</div>
  <div id="divider" hidden></div>
  <button id="mute" type="button" aria-label="背景音樂與音效開關">♪</button>

  <div class="overlay" id="angry" hidden role="alert">
    <div class="rays"></div>
    <div class="ov-inner">
      <div class="ov-tag" id="ovTag" hidden></div>
      <div class="zoom"><img class="bigboss px" id="angryBoss" alt="生氣的老闆"></div>
      <div class="yell pbox" id="yellText"></div>
      <div class="fix pbox" id="fixText"></div>
      <div class="ov-hearts" id="ovHearts"></div>
    </div>
  </div>
</main>
<div id="rot" hidden>手機橫放，畫面會變大喔</div>
</div>

<script>
(function(){
'use strict';

// VOCAB-START

 noun:{

  school:['讀書','寫字','背誦','朗讀','計算','畫圖','舉手','發言','上課','抄寫','回答','思考','複習','擦黑板'],
  play:['跳舞','唱歌','游泳','踢球','打球','跳繩','放風箏','盪鞦韆','爬山','捉迷藏','拍照','彈琴','吹泡泡','溜冰'],
  feel:['哭泣','大笑','尖叫','擁抱','安慰','擔心','道歉','感謝','原諒','鼓勵','稱讚','想念','期待','發抖','嘆氣','流淚']

function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(h,w){const c=hexRgb(h);return 'rgb('+c.map(function(v){return Math.round(v+(255-v)*w)}).join(',')+')'}
function sprite(w,h,draw){
  const c=document.createElement('canvas');c.width=w+2;c.height=h+2;
  const x=c.getContext('2d');
  const R=function(a,b,cw,ch,col){x.fillStyle=col;x.fillRect(a+1,b+1,cw,ch)};
  draw(R);
  const W=c.width,H=c.height;
  const src=x.getImageData(0,0,W,H).data;
  const out=x.createImageData(W,H);out.data.set(src);
  const op=function(i,j){return i>=0&&j>=0&&i<W&&j<H&&src[(j*W+i)*4+3]>0};
  const lc=hexRgb('#1a1240');
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    if(!op(i,j)&&(op(i-1,j)||op(i+1,j)||op(i,j-1)||op(i,j+1))){
      const k=(j*W+i)*4;out.data[k]=lc[0];out.data[k+1]=lc[1];out.data[k+2]=lc[2];out.data[k+3]=255;
    }
  }
  x.putImageData(out,0,0);
  return c.toDataURL();
}

function fishSprite(cols,rows,color){
  const key=cols+color;if(fishCache[key])return fishCache[key];
  const tail=5,cy=rows/2,bw=cols-tail;

  const url=sprite(cols,rows,function(R){
    for(let i=0;i<tail;i++){const half=Math.max(1,Math.floor(4-i*0.75));R(i,cy-half,1,half*2,color)}
    for(let x=tail-1;x<cols;x++){
      const t=(x-(tail-1))/(bw+1);
      const half=Math.max(1.5,(rows/2-1)*Math.sqrt(Math.max(0,1-Math.pow(2*t-1,2))));
      R(x,Math.round(cy-half),1,Math.round(half*2),color);
    }
    R(tail+2,rows-5,Math.max(2,bw-8),2,light);
    R(tail+4,0,6,1,color);
    R(cols-5,3,2,2,'#ffffff');R(cols-4,4,1,1,'#1a1240');
  });
  fishCache[key]=url;return url;
}

  v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(dest);o.start(t);o.stop(t+d+.05);
}
function bgmSched(){
  if(!AC||!bgm.on||AC.state!=='running')return;
  const sp=60/104/2;
  if(bgm.next<AC.currentTime)bgm.next=AC.currentTime+.05;
  while(bgm.next<AC.currentTime+.4){
    const s=bgm.step,bar=Math.floor(s/8)%4,i=s%8,sect=Math.floor(s/32)%2,t=bgm.next;
    if(!muted){
      const n=(sect?LEAD_B:LEAD_A)[bar][i];
      if(n)noteAt(mtof(n),sp*.9,'square',.1,t,bgmGain);
      if(i%2===0)noteAt(mtof(BASS[bar]),sp*1.8,'triangle',.24,t,bgmGain);
    }
    bgm.next+=sp;bgm.step++;
  }
}
function initAudio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.3;master.connect(AC.destination);
      bgmGain=AC.createGain();bgmGain.gain.value=muted?0:.45;bgmGain.connect(master);
    }catch(e){AC=null}
  }
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
  if(AC&&!bgm.on){bgm.on=true;bgm.next=AC.currentTime+.1;bgm.timer=setInterval(bgmSched,100)}
}

function tone(f,d,type,g,t0,slide){
  if(!AC||muted)return;
  const t=AC.currentTime+(t0||0);
  const o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(g||.3,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,g,t0,freq){
  if(!AC||muted)return;
  const t=AC.currentTime+(t0||0);
  const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=buf;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=freq||800;
  const v=AC.createGain();v.gain.setValueAtTime(g||.3,t);v.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(v);v.connect(master);s.start(t);
}

/* ---------- fish ---------- */
function place(f){f.el.style.transform='translate('+f.x.toFixed(1)+'px,'+f.y.toFixed(1)+'px)'+(f.state==='drag'?' scale(1.12)':'')}
function setDir(sd,f,dir){
  if(f.dir===dir)return;
  f.dir=dir;f.fb.style.transform=dir<0?'scaleX(-1)':'none';f.ft.style.left=(dir<0?2*sd.k:6*sd.k)+'px';
}
function nextType(sd){if(!sd.bag.length)sd.bag=shuffle(['noun','verb','adj']);return sd.bag.pop()}
function nextWord(sd,type){
  const on={};sd.fish.forEach(function(f){on[f.word]=1});
  let w,n=0;
  do{
    if(!sd.decks[type]||!sd.decks[type].length)sd.decks[type]=shuffle(POOL[type]);
    w=sd.decks[type].pop();n++;
  }while(on[w]&&n<20);
  return w;
}
function spawn(sd,edge){
  const type=nextType(sd),word=nextWord(sd,type);
  const n=Array.from(word).length,cols=13+5*n,k=sd.k,W=(cols+2)*k,H=16*k;
  const el=document.createElement('div');el.className='fish';el.style.width=W+'px';el.style.height=H+'px';
  el.innerHTML='<img class="fb px" alt="" src="'+fishSprite(cols,14,pick(FISHC))+'"><span class="ft" style="left:'+(6*k)+'px;width:'+((cols-6)*k)+'px;font-size:'+sd.fs+'px">'+word+'</span>';
  sd.layer.appendChild(el);
  const p=sd.pb,dir=Math.random()<.5?-1:1;
  const f={el:el,fb:el.firstChild,ft:el.lastChild,word:word,type:type,w:W,h:H,dir:1,state:'swim',ph:Math.random()*6.28};
  f.vx=(sd.two?30:36+Math.random()*30)*dir*(0.8+Math.random()*.6);f.vy=(Math.random()-.5)*18;
  f.x=edge?(dir>0?p.l:p.r-W):p.l+Math.random()*Math.max(1,p.r-p.l-W);
  f.by=p.t+10+Math.random()*Math.max(1,p.b-p.t-H-20);f.y=f.by;
  setDir(sd,f,dir);place(f);sd.fish.push(f);return f;
}
function removeFish(sd,f){const i=sd.fish.indexOf(f);if(i>=0)sd.fish.splice(i,1);if(sd.sel===f)sd.sel=null}
function clearFish(sd){sd.fish.forEach(function(f){f.el.remove()});sd.fish=[];sd.sel=null;sd.drag=null}

/* ---------- main loop ---------- */
let last=0,running=false;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(S.mode==='play'&&!S.paused){
    S.left-=dt;
    const sec=Math.max(0,Math.ceil(S.left));
    if(sec!==S.shown){
      S.shown=sec;$('timer').textContent=fmt(sec);
      if(sec<=10&&sec>0){SFX.tick();$('timer').classList.add('low')}
      if(sec===30||sec===10){
        S.sides.forEach(function(sd){if(!sd.out)say(sd,(sec===30?LINES.t30:LINES.t10)[sd.g])});
      }
    }
    S.sides.forEach(function(sd){
      if(sd.out)return;
      const p=sd.pb;
      sd.fish.forEach(function(f){
        if(f.state!=='swim')return;
        f.x+=f.vx*dt;f.ph+=dt*2.2;f.by+=f.vy*dt;
        const minX=p.l,maxX=Math.max(p.l,p.r-f.w);
        if(f.x<minX){f.x=minX;f.vx=Math.abs(f.vx);setDir(sd,f,1)}
        else if(f.x>maxX){f.x=maxX;f.vx=-Math.abs(f.vx);setDir(sd,f,-1)}
        const minY=p.t+8,maxY=Math.max(minY,p.b-f.h-8);
        if(f.by<minY){f.by=minY;f.vy=Math.abs(f.vy)}else if(f.by>maxY){f.by=maxY;f.vy=-Math.abs(f.vy)}
        f.y=f.by+Math.sin(f.ph)*8;place(f);
      });
    });
    if(S.left<=0)endGame('time');
  }
  requestAnimationFrame(frame);
}

function localPt(sd,e){const r=sd.el.getBoundingClientRect();return {x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}

  const r0=sd.el.getBoundingClientRect(),cx=f.x+f.w/2,cy=f.y+f.h/2;
  for(let i=0;i<sd.buckets.length;i++){
    const r=sd.buckets[i].getBoundingClientRect();
    const L=(r.left-r0.left)/SC,T=(r.top-r0.top)/SC,R=(r.right-r0.left)/SC,B=(r.bottom-r0.top)/SC;
    if(cx>L-14&&cx<R+14&&cy>T-14&&cy<B+14)return sd.buckets[i];
  }
  return null;
}

  if(S.mode==='over')return;
  S.mode='over';S.paused=true;clearTimeout(S.ovTimer);$('angry').hidden=true;
  S.sides.forEach(clearFish);
  const two=S.players===2;

  const D=S.sides.map(function(sd){
    const c=sd.correct,t=sd.total;
    return {sd:sd,c:c,t:t,rate:t?Math.round(c/t*100):0,stars:c>=20?3:(c>=10?2:1),
      line:vline(LINES.end[sd.g][sd.hearts]),mood:MOOD[sd.hearts]};
  });
  let html;
  if(!two){
    const d=D[0];
    html='<div class="res"><div class="stars" id="st0">'+starsHTML()+'</div>'+

      '<button class="btn zh" id="againBtn" type="button">再玩一次</button></div>';
  }else{

    const title=win<0?'平手！':('P'+(win+1)+' 獲勝！');
    html='<div class="res"><h2 class="res-title" style="font-size:54px">'+title+'</h2><div class="cols">'+
      D.map(function(d,i){
        return '<div class="col pbox'+(win===i?' win':'')+'">'+(win===i?'<span class="wintag">WIN</span>':'')+
          '<b class="who p'+i+'">P'+(i+1)+'</b><div class="stars sm" id="st'+i+'">'+starsHTML()+'</div>'+
          '<div class="rb"><img class="px" alt="" src="'+BOSS[d.sd.g][d.mood]+'"><div class="bubble pbox" id="rb'+i+'"></div></div>'+
          '<div class="st"><span>答對 <b>'+d.c+'</b> 題</span><span>答對率 <b>'+d.rate+'%</b></span></div></div>';
      }).join('')+'</div>'+
      '<button class="btn zh" id="againBtn" type="button">再玩一次</button></div>';
  }
  $('result').innerHTML=html;
  show('result');
  $('againBtn').addEventListener('click',function(){initAudio();SFX.pick();showModeSelect()});
  D.forEach(function(d,i){
    typeText($('rb'+i),d.line,38);
    const imgs=$('st'+i).querySelectorAll('.star');
    for(let s=0;s<d.stars;s++){
      (function(im,idx){setTimeout(function(){im.src=IMG.star;im.classList.add('on');SFX.star(idx)},450+idx*450)})(imgs[s],s);
    }
  });
  const best=Math.max.apply(null,D.map(function(d){return d.sd.hearts}));
  setTimeout(function(){if(best>=3)SFX.win();else if(best>0)SFX.mid();else SFX.sad()},250);
}

/* ---------- pointer interaction (per side, so two players can touch at once) ---------- */
function bindSide(sd){
  const layer=sd.layer;
  layer.addEventListener('pointerdown',function(e){
    const el=e.target.closest('.fish');
    if(!el||S.mode!=='play'||S.paused||sd.out||sd.drag)return;
    const f=sd.fish.filter(function(x){return x.el===el})[0];if(!f)return;
    e.preventDefault();
    deselect(sd);
    const p=localPt(sd,e);
    sd.drag={f:f,pid:e.pointerId,dx:p.x-f.x,dy:p.y-f.y,sx:e.clientX,sy:e.clientY,moved:false};
    f.state='drag';el.classList.add('held');place(f);
    try{el.setPointerCapture(e.pointerId)}catch(err){}
    SFX.pick();
  });
  layer.addEventListener('pointermove',function(e){
    const d=sd.drag;if(!d||d.pid!==e.pointerId)return;
    const f=d.f,p=localPt(sd,e);
    if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>8*SC)d.moved=true;
    f.x=clamp(p.x-d.dx,-20,sd.W-f.w+20);
    f.y=clamp(p.y-d.dy,0,540-f.h);
    place(f);
    const hot=bucketAt(sd,f);
    sd.buckets.forEach(function(b){b.classList.toggle('hot',b===hot)});
  });
  function endDrag(e,cancel){
    const d=sd.drag;if(!d||d.pid!==e.pointerId)return;sd.drag=null;
    const f=d.f;
    f.el.classList.remove('held');
    sd.buckets.forEach(function(b){b.classList.remove('hot')});
    if(S.mode!=='play'||S.paused||f.state==='gone')return;
    if(!d.moved&&!cancel){
      f.state='sel';sd.sel=f;f.el.classList.add('sel');place(f);
      say(sd,'再點一下桶子，把「'+f.word+'」放進去！');
      return;
    }
    const b=cancel?null:bucketAt(sd,f);
    if(b){S.justDrop=performance.now();judge(sd,f,b);return}
    f.state='swim';f.by=clamp(f.y,sd.pb.t+8,Math.max(sd.pb.t+8,sd.pb.b-f.h-8));f.y=f.by;
    f.x=clamp(f.x,sd.pb.l,Math.max(sd.pb.l,sd.pb.r-f.w));place(f);
  }
  layer.addEventListener('pointerup',function(e){endDrag(e,false)});
  layer.addEventListener('pointercancel',function(e){endDrag(e,true)});
  sd.buckets.forEach(function(b){
    b.addEventListener('click',function(){
      if(performance.now()-S.justDrop<400)return;
      if(sd.sel&&S.mode==='play'&&!S.paused)judge(sd,sd.sel,b);
    });
  });
  sd.el.addEventListener('pointerdown',function(e){
    if(e.target.closest('.fish')||e.target.closest('.bucket'))return;
    if(sd.sel){sd.sel.state='swim';sd.sel.by=sd.sel.y;deselect(sd);say(sd,vline(LINES.hint[sd.g]))}
  });
}
function deselect(sd){if(sd.sel){sd.sel.el.classList.remove('sel');if(sd.sel.state==='sel')sd.sel.state='swim';sd.sel=null}}

showModeSelect();
})();
</script>
